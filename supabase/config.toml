# verify_jwt = false em TODAS as funções deste repo, igual ao que está no ar.
# Nenhuma fica aberta: cada uma valida quem chama dentro do código.
#   segredo compartilhado em header: alertas-criticos (ALERTAS_SECRET),
#     raiox-mensal-cron (RAIOX_CRON_SECRET), social-publisher /
#     social-metricas / social-token-renovar (SOCIAL_CRON_SECRET),
#     founder-monitor (FOUNDER_MONITOR_SECRET ou JWT de admin conferido no código),
#     reenviar-emails (segredo só no Vault, conferido por RPC; PAY-27),
#     tiktok-sync e ml-sync (segredo só no Vault, conferido por RPC; VND-05, VND-30),
#     redes-token-renovar (segredo só no Vault, conferido por RPC; ONE-154)
#   assinatura do provedor: stripe-webhook (HMAC do Stripe), tiktok-webhook (HMAC do TikTok)
#   aviso sem assinatura, só põe id na fila de vendedora conectada: ml-webhook (VND-30)
#   token de verificação da Meta: ig-webhook (bot desativado, só responde o desafio)
#   JWT conferido no código (auth.getUser + is_admin): social-ia
#   segredo só no Vault, conferido por RPC: push-lembretes (AND-06)
#   JWT conferido no código (auth.getUser, só os aparelhos da própria conta): push-teste
